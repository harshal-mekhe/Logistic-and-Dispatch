<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dispatch Order Entry</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background-color: #f9f9f9;
                font-family: Arial, Helvetica, sans-serif;
                min-height: 100vh;
            }

            .main-form {
                width: 90vw;
                min-height: 90vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .main-text {
                background-color: #5b2e8a;
            }

            h1.main-text {
                font-size: 30px !important;
            }

            h4.main-text {
                font-size: 20px !important;
            }

            .form-label {
                font-weight: 700;
                font-size: 16px;
                color: #5b2e8a;
            }

            .div-form {
                font-size: 15px;
            }

            .form-control,
            .form-select,
            textarea.form-control {
                font-size: 15px;
                font-family: Arial, Helvetica, sans-serif;
                color: #1f2937;
            }

            .toggle-container {
                padding: 2px;
                border-radius: 30px;
                display: inline-flex;
                overflow: hidden;
                background-color: #fff;
            }

            /* Custom radio-to-button toggler styling */
            .mode-toggle input[type="radio"] {
                display: none;
            }

            .mode-toggle label {
                border: none;
                background: none;
                padding: 6px 24px;
                font-weight: bold;
                color: #5b2e8a;
                cursor: pointer;
                border-radius: 30px;
                display: inline-block;
                transition: all 0.2s ease;
            }

            .mode-toggle input[type="radio"]:checked + label {
                background-color: #5b2e8a;
                color: #fff;
            }

            .form-control:disabled {
                background-color: #e9ecef !important;
                cursor: not-allowed !important;
                opacity: 0.8;
            }

            #fetch-id-wrapper {
                position: relative;
                margin-bottom: 0px !important;
            }

            .action-btn-layout {
                background: linear-gradient(135deg, #d97706, #f59e0b) !important;
                color: #fff !important;
                border: none !important;
                border-radius: 24px !important;
                font-weight: 700 !important;
                font-size: 15px !important;
                padding: 11px 26px !important;
                box-shadow: 0 3px 10px rgba(0,0,0,0.12) !important;
                transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease !important;
            }
            .action-btn-layout:hover { filter: brightness(1.08) !important; transform: translateY(-2px) !important; }

            /* Specific styling for DispatchOrder save btn */
            #save-btn {
                background: linear-gradient(135deg, #16a34a, #22c55e) !important;
            }

            #previous-btn {
                background: linear-gradient(135deg, #4f46e5, #6366f1) !important;
                color: #fff !important;
                border: none !important;
                border-right: 1px solid rgba(255,255,255,0.25) !important;
                border-radius: 24px 0 0 24px !important;
                font-weight: 700 !important;
                font-size: 15px !important;
                box-shadow: none !important;
                transition: filter 0.15s ease !important;
            }
            #previous-btn:hover { filter: brightness(1.1) !important; }

            #next-btn {
                background: linear-gradient(135deg, #0891b2, #22d3ee) !important;
                color: #fff !important;
                border: none !important;
                border-radius: 0 24px 24px 0 !important;
                font-weight: 700 !important;
                font-size: 15px !important;
                box-shadow: none !important;
                transition: filter 0.15s ease !important;
            }
            #next-btn:hover { filter: brightness(1.1) !important; }

            a.btn[href*="dashboard"],
            #exit-btn {
                background: linear-gradient(135deg, #dc2626, #f87171) !important;
                color: #fff !important;
                border: none !important;
                border-radius: 24px !important;
                font-weight: 700 !important;
                font-size: 15px !important;
                padding: 11px 26px !important;
                box-shadow: 0 3px 10px rgba(0,0,0,0.12) !important;
                transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease !important;
                text-decoration: none;
            }
            a.btn[href*="dashboard"]:hover,
            #exit-btn:hover { filter: brightness(1.08) !important; transform: translateY(-2px) !important; }

            .id-alert {
                position: absolute;
                top: 100%;
                left: 146px;
                z-index: 10;
                border: 1px solid #f5c2c7 !important;
                background-color: #f8d7da !important;
                color: #842029 !important;
                border-radius: 10px;
                padding: 4px;
                font-weight: 500;
                font-size: 0.9rem;
                max-width: 300px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            }
        </style>
    </head>

    <body class="bg-primary-subtle d-flex align-items-center justify-content-center">

        <div class="main-form border rounded-5 p-5 shadow-lg bg-white mx-auto">
            <div class="row m-0 w-100">
                <div class="col p-0">
                    <div class="d-flex justify-content-center mb-2">
                        <h1 class="main-text fw-bold text-white px-5 py-3 rounded-3 text-center fs-2 shadow-sm">Logistic and Dispatch Management System</h1>
                    </div>
                    <div class="d-flex justify-content-center mb-4">
                        <h4 class="main-text fw-bold text-white px-5 py-2 rounded-3 text-center fs-3 shadow-sm">Dispatch Order Transaction Entry</h4>
                    </div>

                    <form id="dispatch-order-form">
                        <div class="div-form mb-4 px-5 py-4 rounded-5 shadow-lg" style="background-color: #F3EAF9;">
                            
                            <!-- Row 1: Order ID (Left) & Dispatch Date (Right) -->
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div id="fetch-id-wrapper" class="d-flex align-items-center text-nowrap gap-3 position-relative">
                                        <label for="order-id" class="form-label mb-0" style="width: 130px; min-width: 130px;">Order ID: <span class="text-danger">*</span></label>
                                        <div class="d-flex align-items-center gap-2">
                                            <input type="number" class="form-control" id="order-id" style="width: 100px;">
                                            <div class="toggle-container border mode-toggle" id="mode-toggle">
                                                <input type="radio" name="form-mode" id="mode-find" value="find" checked />
                                                <label for="mode-find" style="cursor: pointer;">Find</label>
                                                
                                                <input type="radio" name="form-mode" id="mode-new" value="new" />
                                                <label for="mode-new" style="cursor: pointer;">New</label>
                                            </div>
                                        </div>
                                        <div id="id-alert" class="id-alert mt-1" style="display: none;"></div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="d-flex align-items-center text-nowrap gap-3">
                                        <label for="dispatch-date" class="form-label mb-0" style="width: 130px; min-width: 130px;">Dispatch Date: <span class="text-danger">*</span></label>
                                        <input type="date" class="form-control" id="dispatch-date" style="max-width: 300px; width: 100%;">
                                    </div>
                                </div>
                            </div>

                            <!-- Row 2: Customer (Left) & Status (Right) -->
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="d-flex align-items-center text-nowrap gap-3">
                                        <label for="customer-id-display" class="form-label mb-0" style="width: 130px; min-width: 130px;">Customer: <span class="text-danger">*</span></label>
                                        <div class="position-relative" style="max-width: 300px; width: 100%;">
                                            <input type="hidden" id="customer-id" />
                                            <input type="text" id="customer-id-display" class="form-control" placeholder="Select Customer" readonly style="cursor: pointer;" />
                                            
                                            <!-- Dynamic LOV Dropdown container -->
                                            <div id="customer-dropdown" class="card shadow-lg p-2 position-absolute bg-white border border-[#E8E8EA]" style="display: none; top: 100%; left: 0; z-index: 1000; width: 300px; max-height: 220px; overflow-y: auto;">
                                                <input type="text" class="form-control form-control-sm lov-search mb-2" placeholder="Search by ID or Name..." />
                                                <table class="table table-sm table-hover table-bordered mb-0" style="font-size: 13px;">
                                                    <thead>
                                                        <tr class="table-light">
                                                            <th>Cust. ID</th>
                                                            <th>Customer Name</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="customer-table-body" style="cursor: pointer;"></tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="d-flex align-items-center text-nowrap gap-3">
                                        <label for="status" class="form-label mb-0" style="width: 130px; min-width: 130px;">Status: <span class="text-danger">*</span></label>
                                        <select class="form-select" id="status" style="max-width: 300px; width: 100%;">
                                            <option value="">Loading statuses...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Row 3: Source (Left) & Destination (Right) -->
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="d-flex align-items-start text-nowrap gap-3">
                                        <label for="source" class="form-label pt-1 mb-0" style="width: 130px; min-width: 130px;">Source: <span class="text-danger">*</span></label>
                                        
                                        <textarea class="form-control" id="source" rows="3" style="max-width: 300px; width: 100%;"></textarea>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="d-flex align-items-start text-nowrap gap-3">
                                        <label for="destination" class="form-label pt-1 mb-0" style="width: 130px; min-width: 130px;">Destination: <span class="text-danger">*</span></label>
                                        <textarea class="form-control" id="destination" rows="3" style="max-width: 300px; width: 100%;"></textarea>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <!-- Action and Navigation Buttons -->
                        <div class="mb-2 d-flex justify-content-center mx-auto gap-3 pt-2">
                            <!-- Save and Update buttons toggle state is controlled via JS display -->
                            <button type="button" class="btn btn-success action-btn-layout rounded-3 px-4 fw-bold text-white" id="save-btn" style="display: none;">Save</button>
                            <button type="button" class="btn btn-warning action-btn-layout rounded-3 px-4 fw-bold text-dark" id="update-btn" style="display: inline-flex;">Update</button>

                            <div class="btn-group rounded-pill overflow-hidden gap-1">
                                <button type="button" class="btn btn-primary text-white d-inline-flex align-items-center gap-2" id="previous-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-step-back">
                                        <path d="M13.971 4.285A2 2 0 0 1 17 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z" />
                                        <path d="M21 20V4" />
                                    </svg>
                                    <span style="display: inline !important; font-weight: bold;">Previous</span>
                                </button>
                                <button type="button" class="btn btn-primary text-white d-inline-flex align-items-center gap-2 px-4" id="next-btn">
                                    <span style="display: inline !important; font-weight: bold;">Next</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-step-forward">
                                        <path d="M10.029 4.285A2 2 0 0 0 7 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z" />
                                        <path d="M3 4v16" />
                                    </svg>
                                </button>
                            </div>

                            <a href="admin-dashboard.html" class="btn bg-danger-subtle text-danger border border-danger-subtle rounded-3 px-4 d-flex align-items-center fw-bold" id="exit-btn">Exit</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="../JS/dispatchOrder.js"></script>
    </body>

</html>
